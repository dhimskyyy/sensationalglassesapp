name: sensationalglassesapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_sign_in: ^6.2.1
  firebase_auth: ^5.4.4
  firebase_core: ^3.8.0
  flutter_facebook_auth: ^5.0.6
  get: ^4.6.6
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  cloud_firestore: ^5.6.12
  http: ^0.13.6
  mobile_scanner: ^7.1.4
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_polyline_points: ^1.0.0
  flutter_dotenv: ^6.0.0
  firebase_storage: ^12.4.10
  image_picker: ^1.2.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: any

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env

flutter_native_splash:
  color: "#6ED9C7"
  image: assets/logo.png
  fullscreen: true
  android: true
  ios: true
  web: false
